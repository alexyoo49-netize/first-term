<div id="first-term-government" aria-label="통일정부 국정지도"></div>
<style>
#first-term-government{--g-bg:light-dark(#f0f4f7,#10191f);--g-map:light-dark(#f8fafb,#152128);--g-panel:light-dark(#ffffff,#1c2b35);--g-text:light-dark(#172c3b,#edf5f7);--g-muted:light-dark(#5f7381,#a3b7c3);--g-line:light-dark(#cbd8df,#334955);--g-accent:light-dark(#007fac,#25b7ed);--g-blue:light-dark(#078abf,#079bce);--g-blue-soft:light-dark(#e1f3fa,#143f50);--g-green:light-dark(#468700,#98d739);--g-red:light-dark(#c64b30,#ff7654);--g-policy:light-dark(#ffffff,#edf3f5);--g-ink:#182e3d;--g-overlay:light-dark(#183349b3,#06101bd9);color:var(--g-text);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--g-bg);border:1px solid var(--g-line);border-radius:12px;overflow:clip;position:relative;isolation:isolate}
#first-term-government *{box-sizing:border-box}
#first-term-government h1,#first-term-government h2,#first-term-government h3,#first-term-government p{margin:0}
#first-term-government button,#first-term-government input{font:inherit}
#first-term-government button{color:inherit}
#first-term-government button:disabled{opacity:.45;cursor:not-allowed}
#first-term-government button:focus-visible,#first-term-government input:focus-visible{outline:3px solid var(--g-accent);outline-offset:4px}
#first-term-government [hidden]{display:none!important}
#first-term-government .g-brandbar{display:flex;justify-content:space-between;align-items:center;padding:17px 112px 17px 20px;gap:20px;background:var(--g-panel)}
#first-term-government .g-brand{display:flex;align-items:center;gap:11px}
#first-term-government .g-brand-icon{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--g-accent);border-radius:9px;color:var(--g-accent)}
#first-term-government .g-brand h1{font-size:22px;letter-spacing:-.06em;font-weight:700;line-height:1.1}
#first-term-government .g-brand small{display:block;color:var(--g-muted);font-size:11px;letter-spacing:.17em;margin-top:5px}
#first-term-government .g-scenario{font-size:13px;color:var(--g-muted);text-align:right}
#first-term-government .g-scenario b{display:block;color:var(--g-text);font-size:14px}
#first-term-government .g-toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:stretch;background:var(--g-panel);border-top:1px solid var(--g-line);border-bottom:1px solid var(--g-line)}
#first-term-government .g-fin{padding:11px 16px;border:0;border-right:1px solid var(--g-line);background:transparent;text-align:left;min-width:0}
#first-term-government .g-fin:hover{background:var(--g-blue-soft)}
#first-term-government .g-fin span{display:block;font-size:11px;color:var(--g-accent);margin-bottom:3px}
#first-term-government .g-fin b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#first-term-government .g-fin em{font-size:11px;font-style:normal;color:var(--g-muted);margin-left:3px}
#first-term-government .g-tools{display:flex;align-items:stretch}
#first-term-government .g-tool{min-width:61px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:0;border-right:1px solid var(--g-line);font-size:11px!important}
#first-term-government .g-tool:hover{background:var(--g-blue-soft);color:var(--g-accent)}
#first-term-government .g-shell{display:grid;grid-template-columns:170px minmax(0,1fr)}
#first-term-government .g-sidebar{background:var(--g-panel);border-right:1px solid var(--g-line);padding:19px 14px;min-width:0}
#first-term-government .g-president{display:flex;gap:9px;align-items:center;padding-bottom:15px;border-bottom:1px solid var(--g-line)}
#first-term-government .g-president>i,#first-term-government .g-president>svg{color:var(--g-accent);width:25px;height:25px;flex:0 0 25px}
#first-term-government .g-president strong{font-size:14px;display:block}
#first-term-government .g-president small{color:var(--g-muted);font-size:11px;word-break:keep-all}
#first-term-government .g-capital{padding:17px 0 15px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--g-line)}
#first-term-government .g-capital span{font-size:12px;color:var(--g-muted)}
#first-term-government .g-capital b{display:block;font-size:38px;font-weight:500;line-height:1.2;color:var(--g-accent);font-variant-numeric:tabular-nums}
#first-term-government .g-capital small{font-size:11px;color:var(--g-muted);padding-bottom:7px}
#first-term-government .g-public{padding:17px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
#first-term-government .g-public span{font-size:12px}
#first-term-government .g-public b{font-size:20px;font-weight:600}
#first-term-government .g-groups{display:grid;gap:16px}
#first-term-government .g-group{padding:0;border:0;background:transparent;text-align:left}
#first-term-government .g-group-line{display:flex;justify-content:space-between;gap:5px;font-size:12px;margin-bottom:5px}
#first-term-government .g-group-line b{font-weight:500;font-variant-numeric:tabular-nums}
#first-term-government .g-track{height:6px;background:var(--g-bg);border-radius:4px;overflow:hidden}
#first-term-government .g-track span{height:100%;display:block;background:var(--g-accent);border-radius:4px}
#first-term-government .g-sidebar-note{margin-top:19px;color:var(--g-muted);font-size:11px}
#first-term-government .g-main{min-width:0;background:var(--g-map)}
#first-term-government .g-mapbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--g-line)}
#first-term-government .g-mapbar strong{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
#first-term-government .g-legend{display:flex;gap:14px;font-size:11px;color:var(--g-muted);flex-wrap:wrap}
#first-term-government .g-legend span{display:flex;align-items:center;gap:4px}
#first-term-government .g-legend .g-up{color:var(--g-green)}
#first-term-government .g-legend .g-down{color:var(--g-red)}
#first-term-government .g-map{height:610px;position:relative;background:radial-gradient(ellipse at 50% 42%,var(--g-blue-soft),transparent 65%);overflow:hidden}
#first-term-government .g-divisions,#first-term-government .g-edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#first-term-government .g-divisions path{fill:none;stroke:var(--g-line);stroke-width:1;stroke-dasharray:5 8;vector-effect:non-scaling-stroke;opacity:.7}
#first-term-government .g-edges{z-index:1;overflow:visible}
#first-term-government .g-edges path.g-edge{fill:none;stroke-width:2;opacity:.8}
#first-term-government .g-sector{position:absolute;color:var(--g-muted);font-size:15px;font-weight:600;letter-spacing:-.04em;pointer-events:none}
#first-term-government .g-sector small{display:block;font-size:11px;font-weight:400;margin-top:3px;color:var(--g-muted)}
#first-term-government .g-node{position:absolute;left:clamp(50px,var(--x),calc(100% - 50px));top:var(--y);transform:translate(-50%,-50%);z-index:2;width:118px;display:flex;flex-direction:column;align-items:center;background:transparent;border:0;padding:5px 0;text-align:center;transition:opacity .15s}
#first-term-government .g-orb{width:var(--size,62px);height:var(--size,62px);border-radius:50%;background:var(--g-policy);color:var(--g-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 12px #00000012;position:relative;transition:box-shadow .15s,transform .15s}
#first-term-government .g-orb svg{width:27px;height:27px;stroke-width:1.8}
#first-term-government .g-node b{font-size:13px;font-weight:600;background:var(--g-map);border-radius:3px;padding:2px 5px;margin-top:6px;max-width:118px;white-space:nowrap}
#first-term-government .g-node small{font-size:11px;color:var(--g-muted);margin-top:1px;background:var(--g-map);padding:0 3px}
#first-term-government .g-node[data-kind="metric"] .g-orb{background:var(--g-blue);color:#ffffff}
#first-term-government .g-node[data-kind="metric"] .g-orb strong{font-size:20px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums}
#first-term-government .g-node[data-kind="metric"] .g-orb span{font-size:11px;margin-top:2px}
#first-term-government .g-node[data-kind="crisis"] .g-orb{background:var(--g-red);color:light-dark(#fff,#10191f)}
#first-term-government .g-node[data-kind="crisis"] b{color:var(--g-red)}
#first-term-government .g-node.is-active .g-orb{box-shadow:0 0 0 4px var(--g-map),0 0 0 7px var(--g-accent),0 7px 24px #009dc92e;transform:scale(1.045)}
#first-term-government .g-node.is-active b{color:var(--g-accent)}
#first-term-government .g-node.is-related .g-orb{box-shadow:0 0 0 2px var(--g-map),0 0 0 3px var(--g-line)}
#first-term-government .g-node.is-dim .g-orb{opacity:.68}
#first-term-government .g-node.is-dim b{color:var(--g-muted)}
#first-term-government .g-node:hover{opacity:1}
#first-term-government .g-node.is-off .g-orb{background:var(--g-panel);border:1px dashed var(--g-muted);color:var(--g-muted);box-shadow:none}
#first-term-government .g-new{position:absolute;right:-1px;bottom:-1px;background:var(--g-accent);color:var(--g-panel);width:21px;height:21px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:16px}
#first-term-government .g-mapnote{padding:12px 18px;border-top:1px solid var(--g-line);font-size:12px;display:flex;gap:8px;align-items:center;min-height:44px}
#first-term-government .g-mapnote i,#first-term-government .g-mapnote svg{color:var(--g-accent);flex:0 0 16px}
#first-term-government .g-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid var(--g-line);background:var(--g-panel);padding:15px 20px}
#first-term-government .g-time{display:flex;align-items:center;gap:14px;min-width:0}
#first-term-government .g-time strong{font-size:14px;white-space:nowrap}
#first-term-government .g-steps{display:flex;gap:5px}
#first-term-government .g-steps span{width:20px;height:6px;background:var(--g-line)}
#first-term-government .g-steps span.done{background:var(--g-accent)}
#first-term-government .g-time small{font-size:11px;color:var(--g-muted);display:block}
#first-term-government .g-next{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 23px;border:0;border-radius:5px;background:var(--g-accent);color:light-dark(#fff,#052739);font-weight:600;white-space:nowrap}
#first-term-government .g-bottom{background:var(--g-panel);padding:0 20px 12px;font-size:11px;color:var(--g-muted);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
#first-term-government .g-layer{position:absolute;inset:0;background:var(--g-overlay);z-index:20;padding:110px 20px 30px;backdrop-filter:blur(3px)}
#first-term-government .g-dialog{max-width:720px;margin:0 auto;background:var(--g-panel);color:var(--g-text);border:1px solid var(--g-line);border-top:4px solid var(--g-accent);box-shadow:0 20px 100px #00000050;border-radius:8px;overflow:clip}
#first-term-government .g-dialoghead{padding:20px 23px 17px;display:flex;align-items:flex-start;justify-content:space-between;gap:15px;border-bottom:1px solid var(--g-line)}
#first-term-government .g-dialogtitle{display:flex;align-items:center;gap:13px;min-width:0}
#first-term-government .g-dialogicon{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--g-blue-soft);color:var(--g-accent);flex:0 0 48px}
#first-term-government .g-dialogtitle h2{font-size:23px;font-weight:600;letter-spacing:-.03em}
#first-term-government .g-dialogtitle small{font-size:12px;color:var(--g-muted);display:block;margin-top:3px}
#first-term-government .g-close{width:35px;height:35px;display:flex;align-items:center;justify-content:center;flex:0 0 35px;border:0;border-radius:4px;background:var(--g-bg)}
#first-term-government .g-dialogbody{padding:21px 23px}
#first-term-government .g-policy-top{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:24px}
#first-term-government .g-description{font-size:13px;color:var(--g-muted);line-height:1.8}
#first-term-government .g-minister{padding-left:16px;border-left:1px solid var(--g-line);font-size:12px}
#first-term-government .g-minister b{display:block;font-size:13px;margin-bottom:8px}
#first-term-government .g-minister div{display:flex;justify-content:space-between;margin:4px 0}
#first-term-government .g-minister span{color:var(--g-muted)}
#first-term-government .g-control{margin-top:21px;padding:18px 0;border-top:1px solid var(--g-line);border-bottom:1px solid var(--g-line)}
#first-term-government .g-control-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#first-term-government .g-control-head label{font-size:13px;color:var(--g-muted)}
#first-term-government .g-control-head b{font-size:29px;font-weight:500;font-variant-numeric:tabular-nums}
#first-term-government .g-control-head small{font-size:12px;color:var(--g-muted)}
#first-term-government .g-slider{width:100%;accent-color:var(--g-accent);margin:16px 0 3px}
#first-term-government .g-ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--g-muted)}
#first-term-government .g-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:17px 0 20px}
#first-term-government .g-preview span{display:block;font-size:11px;color:var(--g-muted)}
#first-term-government .g-preview b{display:block;font-size:19px;font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}
#first-term-government .g-influences{list-style:none;padding:0;margin:0;display:grid;gap:10px}
#first-term-government .g-influences li{display:grid;grid-template-columns:105px minmax(0,1fr) 75px;gap:12px;align-items:center;font-size:12px}
#first-term-government .g-impacttrack{height:6px;background:var(--g-bg);position:relative;overflow:hidden;border-radius:3px}
#first-term-government .g-impacttrack span{height:100%;position:absolute;display:block;left:50%;background:var(--g-green)}
#first-term-government .g-impacttrack span.negative{left:auto;right:50%;background:var(--g-red)}
#first-term-government .g-influences em{font-style:normal;text-align:right;color:var(--g-muted);font-size:11px}
#first-term-government .g-effect-title{font-size:12px;color:var(--g-muted);margin-bottom:11px}
#first-term-government .g-dialogfoot{padding:14px 23px;background:var(--g-bg);border-top:1px solid var(--g-line);display:flex;align-items:center;justify-content:space-between;gap:15px}
#first-term-government .g-dialogfoot .g-message{font-size:12px;color:var(--g-muted);min-width:0}
#first-term-government .g-apply{border:0;background:var(--g-accent);color:light-dark(#fff,#052739);border-radius:5px;padding:12px 19px;white-space:nowrap;font-weight:600}
#first-term-government .g-data-row{padding:12px 0;border-bottom:1px solid var(--g-line);display:flex;justify-content:space-between;gap:20px;font-size:13px}
#first-term-government .g-data-row span{color:var(--g-muted)}
#first-term-government .g-data-row b{font-weight:500;font-variant-numeric:tabular-nums}
#first-term-government .g-related{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
#first-term-government .g-related button{border:1px solid var(--g-line);background:var(--g-bg);padding:7px 10px;border-radius:4px;font-size:12px}
#first-term-government .g-report-title{font-size:32px;color:var(--g-accent);margin:0 0 16px;line-height:1.3}
#first-term-government .g-info{font-size:13px;color:var(--g-muted);line-height:1.8}
#first-term-government .g-cabinet{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
#first-term-government .g-cabinet section{border-bottom:1px solid var(--g-line);padding:10px 0}
#first-term-government .g-cabinet h3{font-size:13px;margin-bottom:7px}
#first-term-government .g-cabinet p{font-size:12px;color:var(--g-muted)}
#first-term-government .g-toast{padding:10px 18px;background:var(--g-blue-soft);color:var(--g-text);font-size:12px;border-bottom:1px solid var(--g-line)}

#first-term-government{--g-bg:light-dark(#e4e2dc,#222421);--g-map:light-dark(#dedfd8,#292d29);--g-panel:light-dark(#f8f5ec,#30312c);--g-text:light-dark(#282d26,#ebe7d9);--g-muted:light-dark(#65685c,#b2b3a3);--g-line:light-dark(#bdbfaf,#505347);--g-accent:light-dark(#475b39,#c0cba5);--g-blue:light-dark(#657851,#9baf82);--g-blue-soft:light-dark(#e3e7d8,#3b4434);--g-green:light-dark(#466b2f,#afc88d);--g-red:light-dark(#a33130,#ed9691);--g-policy:light-dark(#f9f7ef,#e0e0d2);--g-ink:light-dark(#2b3227,#252c22);--g-overlay:light-dark(#282b25c4,#10130edd);--g-warning:light-dark(#a32d30,#efa09b);--g-warning-soft:light-dark(#f2e4df,#493330);--g-warning-fill:light-dark(#a32d30,#b95654);--g-warning-ink:light-dark(#fff5ee,#fff4e8);border-radius:2px;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
#first-term-government a{color:var(--g-accent);text-decoration:underline;text-underline-offset:3px}
#first-term-government .g-brandbar{padding-top:15px;padding-bottom:15px;border-bottom:2px solid var(--g-text)}
#first-term-government .g-brand-icon{border-radius:0;border-color:var(--g-text);color:var(--g-text)}
#first-term-government .g-brand small{letter-spacing:.12em}
#first-term-government .g-face{border-radius:1px;box-shadow:none;filter:saturate(.6)}
#first-term-government .g-next,#first-term-government .g-apply{border-radius:2px;background:var(--g-accent);color:var(--g-panel)}
#first-term-government .g-next-urgent{background:var(--g-warning-fill);color:var(--g-warning-ink)}
#first-term-government .g-campaign{padding:9px 18px 7px}
#first-term-government .g-duel{gap:14px}
#first-term-government .g-contender .g-face{width:48px;height:48px;flex-basis:48px}
#first-term-government .g-contender strong{font-size:15px}
#first-term-government .g-race-values b{font-size:20px}
#first-term-government .g-rival-action{padding-top:7px;margin-top:7px}
#first-term-government .g-pressline{padding-top:8px;padding-bottom:8px}
#first-term-government .g-map{height:650px;background:var(--g-map)}
#first-term-government .g-orb{box-shadow:0 1px 2px light-dark(#33392a24,#00000044)}
#first-term-government .g-node.is-dim{opacity:1}
#first-term-government .g-node.is-dim .g-orb{opacity:.78}
#first-term-government .g-node[data-kind="metric"] .g-orb{color:light-dark(#ffffff,#25311d)}
#first-term-government .g-node.is-active .g-orb{box-shadow:0 0 0 3px var(--g-accent)}
#first-term-government .g-sector{font-size:12px;color:var(--g-muted);font-weight:500}
#first-term-government .g-leader-button .g-face{width:44px;height:44px;flex-basis:44px}
#first-term-government .g-leader-button{padding-bottom:10px}
#first-term-government .g-capital{padding:10px 0}
#first-term-government .g-capital b{font-size:32px}
#first-term-government .g-groups{gap:12px}
#first-term-government .g-power,#first-term-government .g-inline-power,#first-term-government .g-policy-effects>span,#first-term-government .g-action-pick{border-radius:2px}
#first-term-government .g-track,#first-term-government .g-track span,#first-term-government .g-race-track{border-radius:0}
#first-term-government .g-bottom{align-items:center}
#first-term-government .g-bottom button{border:0;background:none;padding:6px 0;color:var(--g-muted);font-size:11px;text-decoration:underline}
#first-term-government .g-dossier-setup{padding:26px 28px 0;background:var(--g-panel)}
#first-term-government .g-setup-masthead{padding-bottom:24px}
#first-term-government .g-setup-masthead>span{font-size:11px;letter-spacing:.14em;color:var(--g-muted)}

#first-term-government{--g-bg:light-dark(#edf0f3,#202328);--g-map:light-dark(#f5f6f7,#181b20);--g-panel:light-dark(#fff,#282c32);--g-text:light-dark(#252932,#f3f5f8);--g-muted:light-dark(#616874,#b3bac5);--g-line:light-dark(#d5d9df,#474d57);--g-accent:light-dark(#007db8,#50beef);--g-blue:light-dark(#008fce,#008fce);--g-blue-soft:light-dark(#e8f5fc,#183c4d);--g-green:light-dark(#519d13,#90d42c);--g-red:light-dark(#e44c20,#ff6b3b);--g-policy:light-dark(#dfe3e7,#d9dee4);--g-ink:light-dark(#303742,#303742);--g-overlay:light-dark(#f0f3f5de,#171a20dd);--g-warning:light-dark(#c33939,#ff8585);--g-warning-soft:light-dark(#fff0f0,#452a30);--g-warning-fill:light-dark(#c63f3f,#c63f3f);--g-warning-ink:light-dark(#fff,#fff);--g-button:light-dark(#0088c5,#0088c5);--g-button-text:light-dark(#fff,#fff);--g-sidebar:light-dark(#e7ebef,#303640);font-family:"First Term Sans","Pretendard","Segoe UI","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;letter-spacing:-.01em;border:0;border-radius:0}
#first-term-government h1,#first-term-government h2,#first-term-government h3,#first-term-government h4,#first-term-government button,#first-term-government input,#first-term-government .g-decision-letter{font-family:inherit}
#first-term-government button{font-weight:500}
#first-term-government .g-brandbar{border:0;padding:20px 115px 20px 22px}
#first-term-government .g-brand-icon{background:var(--g-button);color:var(--g-button-text);border:0;border-radius:50%}
#first-term-government .g-brand h1{font-size:23px;letter-spacing:-.04em;font-weight:750}
#first-term-government .g-brand small{font-size:11px;letter-spacing:.12em}
#first-term-government .g-face{filter:none;border-radius:0;box-shadow:none}
#first-term-government .g-next,#first-term-government .g-apply{border:0;border-radius:4px;background:var(--g-button);color:var(--g-button-text);display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;font-weight:650;min-height:44px}
#first-term-government .g-next-urgent{background:var(--g-warning-fill);color:var(--g-warning-ink)}
#first-term-government .g-newgame{padding:14px 22px 0;background:var(--g-panel)}
#first-term-government .g-newgame-title{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:2px 0 14px}
#first-term-government .g-newgame-title h2{font-size:22px;font-weight:700;letter-spacing:-.035em}
#first-term-government .g-newgame-title p{font-size:12px;color:var(--g-muted)}
#first-term-government .g-candidate-roster{gap:8px}
#first-term-government .g-candidate{padding:0;border:0;border-radius:4px;overflow:hidden;display:block;position:relative;background:var(--g-bg)}
#first-term-government .g-candidate .g-face{display:block;max-width:none;width:100%;aspect-ratio:1.08;filter:none;opacity:1}
#first-term-government .g-candidate-caption{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;background:light-dark(#3c424b,#3c424b);color:var(--g-button-text);padding:9px 5px 7px;min-height:79px}
#first-term-government .g-candidate-caption>b{font-size:16px;font-weight:700}
#first-term-government .g-candidate-caption>small{font-size:11px;color:light-dark(#e4e7eb,#e4e7eb);letter-spacing:-.04em}
#first-term-government .g-candidate-caption>span{font-size:11px;margin-top:3px;min-height:18px;display:flex;align-items:center}
#first-term-government .g-candidate.selected{background:var(--g-button);border:0}
#first-term-government .g-candidate.selected .g-candidate-caption{background:var(--g-button)}
#first-term-government .g-candidate:hover .g-candidate-caption{background:var(--g-button)}
#first-term-government .g-leader-dossier{grid-template-columns:145px minmax(0,1fr) 165px;gap:20px;padding:22px 0;border-bottom:1px solid var(--g-line)}
#first-term-government .g-dossier-name h3{font-size:21px;line-height:1.4;margin:0 0 6px}
#first-term-government .g-dossier-name p{font-size:12px}
#first-term-government .g-dossier-traits{gap:8px}
#first-term-government .g-dossier-traits p{grid-template-columns:77px 1fr;gap:7px;font-size:13px;line-height:1.6}
#first-term-government .g-dossier-traits p b{display:flex;gap:4px;align-items:baseline;font-size:12px;white-space:nowrap}
#first-term-government .g-dossier-traits svg{width:13px;height:13px;flex:0 0 13px;align-self:center}
#first-term-government .g-dossier-traits small{display:block;font-size:11px;color:var(--g-muted);margin-top:3px}
#first-term-government .g-candidate-stats{padding-left:15px;border-left:1px solid var(--g-line)}
#first-term-government .g-candidate-stats dd{font-size:19px;font-weight:700}
#first-term-government .g-scenario-title{margin-top:22px}
#first-term-government .g-scenario-menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;background:transparent;border:0}
#first-term-government .g-scenario-menu button{border:0;border-radius:4px;background:var(--g-bg);padding:14px 11px;min-height:76px;gap:8px;text-align:left;position:relative}
#first-term-government .g-scenario-menu button>svg{width:22px;height:22px;flex:0 0 22px;color:var(--g-muted)}
#first-term-government .g-scenario-menu button>span{font-size:inherit;color:inherit;min-width:0;flex:1}
#first-term-government .g-scenario-menu button>svg:last-child:not(:first-child){width:14px;height:14px;position:absolute;right:7px;top:6px}
#first-term-government .g-scenario-menu b{font-size:13px;font-weight:650;line-height:1.4}
#first-term-government .g-scenario-menu small{font-size:11px;line-height:1.4;margin-top:5px}
#first-term-government .g-scenario-menu button.selected{border:0;box-shadow:none;background:var(--g-button);color:var(--g-button-text)}
#first-term-government .g-scenario-menu button.selected small,#first-term-government .g-scenario-menu button.selected svg{color:var(--g-button-text)}
#first-term-government .g-scenario-file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:25px;padding:20px 0;background:none}
#first-term-government .g-scenario-file h3{font-family:inherit;font-size:16px;font-weight:650;margin:0 0 8px}
