#first-term-government{--g-bg:light-dark(#e4e2dc,#222421);--g-map:light-dark(#dedfd8,#292d29);--g-panel:light-dark(#f8f5ec,#30312c);--g-text:light-dark(#282d26,#ebe7d9);--g-muted:light-dark(#65685c,#b2b3a3);--g-line:light-dark(#bdbfaf,#505347);--g-accent:light-dark(#475b39,#c0cba5);--g-blue:light-dark(#657851,#9baf82);--g-blue-soft:light-dark(#e3e7d8,#3b4434);--g-green:light-dark(#466b2f,#afc88d);--g-red:light-dark(#a33130,#ed9691);--g-policy:light-dark(#f9f7ef,#e0e0d2);--g-ink:light-dark(#2b3227,#252c22);--g-overlay:light-dark(#282b25c4,#10130edd);--g-warning:light-dark(#a32d30,#efa09b);--g-warning-soft:light-dark(#f2e4df,#493330);--g-warning-fill:light-dark(#a32d30,#b95654);--g-warning-ink:light-dark(#fff5ee,#fff4e8);border-radius:2px;font-family:&quot;Malgun Gothic&quot;,&quot;Apple SD Gothic Neo&quot;,sans-serif}
#first-term-government a{color:var(--g-accent);text-decoration:underline;text-underline-offset:3px}
#first-term-government .g-brandbar{padding-top:15px;padding-bottom:15px;border-bottom:2px solid var(--g-text)}
#first-term-government .g-brand-icon{border-radius:0;border-color:var(--g-text);color:var(--g-text)}
#first-term-government .g-brand small{letter-spacing:.12em}
#first-term-government .g-face{border-radius:1px;box-shadow:none;filter:saturate(.6)}
#first-term-government .g-next,#first-term-government .g-apply{border-radius:2px;background:var(--g-accent);color:var(--g-panel)}
#first-term-government .g-next-urgent{background:var(--g-warning-fill);color:var(--g-warning-ink)}
#first-term-government .g-campaign{padding:9px 18px 7px}
#first-term-government .g-duel{gap:14px}
#first-term-government .g-contender .g-face{width:48px;height:48px;flex-basis:48px}
#first-term-government .g-contender strong{font-size:15px}
#first-term-government .g-race-values b{font-size:20px}
#first-term-government .g-rival-action{padding-top:7px;margin-top:7px}
#first-term-government .g-pressline{padding-top:8px;padding-bottom:8px}
#first-term-government .g-map{height:650px;background:var(--g-map)}
#first-term-government .g-orb{box-shadow:0 1px 2px light-dark(#33392a24,#00000044)}
#first-term-government .g-node.is-dim{opacity:1}
#first-term-government .g-node.is-dim .g-orb{opacity:.78}
#first-term-government .g-node[data-kind=&quot;metric&quot;] .g-orb{color:light-dark(#ffffff,#25311d)}
#first-term-government .g-node.is-active .g-orb{box-shadow:0 0 0 3px var(--g-accent)}
#first-term-government .g-sector{font-size:12px;color:var(--g-muted);font-weight:500}
#first-term-government .g-leader-button .g-face{width:44px;height:44px;flex-basis:44px}
#first-term-government .g-leader-button{padding-bottom:10px}
#first-term-government .g-capital{padding:10px 0}
#first-term-government .g-capital b{font-size:32px}
#first-term-government .g-groups{gap:12px}
#first-term-government .g-power,#first-term-government .g-inline-power,#first-term-government .g-policy-effects&gt;span,#first-term-government .g-action-pick{border-radius:2px}
#first-term-government .g-track,#first-term-government .g-track span,#first-term-government .g-race-track{border-radius:0}
#first-term-government .g-bottom{align-items:center}
#first-term-government .g-bottom button{border:0;background:none;padding:6px 0;color:var(--g-muted);font-size:11px;text-decoration:underline}
#first-term-government .g-dossier-setup{padding:26px 28px 0;background:var(--g-panel)}
#first-term-government .g-setup-masthead{padding-bottom:24px}

#first-term-government{--g-bg:light-dark(#edf0f3,#202328);--g-map:light-dark(#f5f6f7,#181b20);--g-panel:light-dark(#fff,#282c32);--g-text:light-dark(#252932,#f3f5f8);--g-muted:light-dark(#616874,#b3bac5);--g-line:light-dark(#d5d9df,#474d57);--g-accent:light-dark(#007db8,#50beef);--g-blue:light-dark(#008fce,#008fce);--g-blue-soft:light-dark(#e8f5fc,#183c4d);--g-green:light-dark(#519d13,#90d42c);--g-red:light-dark(#e44c20,#ff6b3b);--g-policy:light-dark(#dfe3e7,#d9dee4);--g-ink:light-dark(#303742,#303742);--g-overlay:light-dark(#f0f3f5de,#171a20dd);--g-warning:light-dark(#c33939,#ff8585);--g-warning-soft:light-dark(#fff0f0,#452a30);--g-warning-fill:light-dark(#c63f3f,#c63f3f);--g-warning-ink:light-dark(#fff,#fff);--g-button:light-dark(#0088c5,#0088c5);--g-button-text:light-dark(#fff,#fff);--g-sidebar:light-dark(#e7ebef,#303640);font-family:&quot;First Term Sans&quot;,&quot;Pretendard&quot;,&quot;Segoe UI&quot;,&quot;Malgun Gothic&quot;,sans-serif;font-size:14px;line-height:1.5;letter-spacing:-.01em;border:0;border-radius:0}
#first-term-government h1,#first-term-government h2,#first-term-government h3,#first-term-government h4,#first-term-government button,#first-term-government input,#first-term-government .g-decision-letter{font-family:inherit}
#first-term-government button{font-weight:500}
#first-term-government .g-brandbar{border:0;padding:20px 115px 20px 22px}
#first-term-government .g-brand-icon{background:var(--g-button);color:var(--g-button-text);border:0;border-radius:50%}
#first-term-government .g-brand h1{font-size:23px;letter-spacing:-.04em;font-weight:750}
#first-term-government .g-brand small{font-size:11px;letter-spacing:.12em}
#first-term-government .g-face{filter:none;border-radius:0;box-shadow:none}
#first-term-government .g-next,#first-term-government .g-apply{border:0;border-radius:4px;background:var(--g-button);color:var(--g-button-text);display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;font-weight:650;min-height:44px}
#first-term-government .g-next-urgent{background:var(--g-warning-fill);color:var(--g-warning-ink)}
#first-term-government .g-newgame{padding:14px 22px 0;background:var(--g-panel)}
#first-term-government .g-newgame-title{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:2px 0 14px}
#first-term-government .g-newgame-title h2{font-size:22px;font-weight:700;letter-spacing:-.035em}
#first-term-government .g-newgame-title p{font-size:12px;color:var(--g-muted)}
#first-term-government .g-candidate-roster{gap:8px}
#first-term-government .g-candidate{padding:0;border:0;border-radius:4px;overflow:hidden;display:block;position:relative;background:var(--g-bg)}
#first-term-government .g-candidate .g-face{display:block;max-width:none;width:100%;aspect-ratio:1.08;filter:none;opacity:1}
#first-term-government .g-candidate-caption{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;background:light-dark(#3c424b,#3c424b);color:var(--g-button-text);padding:9px 5px 7px;min-height:79px}
#first-term-government .g-candidate-caption&gt;b{font-size:16px;font-weight:700}
#first-term-government .g-candidate-caption&gt;small{font-size:11px;color:light-dark(#e4e7eb,#e4e7eb);letter-spacing:-.04em}
#first-term-government .g-candidate-caption&gt;span{font-size:11px;margin-top:3px;min-height:18px;display:flex;align-items:center}
#first-term-government .g-candidate.selected{background:var(--g-button);border:0}
#first-term-government .g-candidate.selected .g-candidate-caption{background:var(--g-button)}
#first-term-government .g-candidate:hover .g-candidate-caption{background:var(--g-button)}
#first-term-government .g-leader-dossier{grid-template-columns:145px minmax(0,1fr) 165px;gap:20px;padding:22px 0;border-bottom:1px solid var(--g-line)}
#first-term-government .g-dossier-name h3{font-size:21px;line-height:1.4;margin:0 0 6px}
#first-term-government .g-dossier-name p{font-size:12px}
#first-term-government .g-dossier-traits{gap:8px}
#first-term-government .g-dossier-traits p{grid-template-columns:77px 1fr;gap:7px;font-size:13px;line-height:1.6}
#first-term-government .g-dossier-traits p b{display:flex;gap:4px;align-items:baseline;font-size:12px;white-space:nowrap}
#first-term-government .g-dossier-traits svg{width:13px;height:13px;flex:0 0 13px;align-self:center}
#first-term-government .g-dossier-traits small{display:block;font-size:11px;color:var(--g-muted);margin-top:3px}
#first-term-government .g-candidate-stats{padding-left:15px;border-left:1px solid var(--g-line)}
#first-term-government .g-candidate-stats dd{font-size:19px;font-weight:700}
#first-term-government .g-scenario-title{margin-top:22px}
#first-term-government .g-scenario-menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;background:transparent;border:0}
#first-term-government .g-scenario-menu button{border:0;border-radius:4px;background:var(--g-bg);padding:14px 11px;min-height:76px;gap:8px;text-align:left;position:relative}
#first-term-government .g-scenario-menu button&gt;svg{width:22px;height:22px;flex:0 0 22px;color:var(--g-muted)}
#first-term-government .g-scenario-menu button&gt;span{font-size:inherit;color:inherit;min-width:0;flex:1}
#first-term-government .g-scenario-menu button&gt;svg:last-child:not(:first-child){width:14px;height:14px;position:absolute;right:7px;top:6px}
#first-term-government .g-scenario-menu b{font-size:13px;font-weight:650;line-height:1.4}
#first-term-government .g-scenario-menu small{font-size:11px;line-height:1.4;margin-top:5px}
#first-term-government .g-scenario-menu button.selected{border:0;box-shadow:none;background:var(--g-button);color:var(--g-button-text)}
